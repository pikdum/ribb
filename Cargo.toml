[package]
name = "ribb"
version = "0.1.0"
edition = "2021"
description = "rust iced booru browser — a native port of ebb"
license = "MIT OR Apache-2.0"

[lib]
name = "ribb"
path = "src/lib.rs"

[[bin]]
name = "ribb"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls avoids OpenSSL system linkage on Nix; json for response decoding.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
thiserror = "2"
# Normalize provider timestamps to RFC3339 UTC (matches ebb's Date.toISOString()).
chrono = { version = "0.4", default-features = false, features = [
    "std",
    "clock",
] }
# Gelbooru/Rule34 return double-HTML-encoded tag names.
html-escape = "0.2"

# GUI. `wgpu` + `advanced` match iced_ruffle (shared wgpu device); `image` for
# thumbnails/full images; `tokio` drives async Tasks (reqwest fetches).
iced = { version = "0.14", features = ["tokio", "image", "wgpu", "advanced"] }
# SWF playback widget (pins iced 0.14 / wgpu 27).
iced_ruffle = { git = "https://github.com/pikdum/iced_ruffle" }
# iced_ruffle = { path = "../iced_ruffle" }
# Persist settings under the platform config dir (replaces ebb's localStorage).
directories = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Open post pages / links in the user's browser.
open = "5"
# Retry-delay sleeps + a semaphore to cap concurrent image fetch/decode.
tokio = { version = "1", features = ["time", "sync", "rt"] }
# Decode + downscale thumbnails off the render thread (same version as iced).
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "gif",
    "webp",
] }
lucide-icons = { version = "1.17.0", features = ["iced"] }
# Video playback: ffmpeg-next decodes to RGBA (video) + f32 (audio); cpal plays
# the audio; bytemuck feeds the wgpu shader uniform; tempfile backs ffmpeg's
# file input (we fetch bytes with our own client to satisfy CDN hotlink headers).
ffmpeg-next = "8.1"
cpal = "0.16"
bytemuck = "1"
tempfile = "3"
# Same wgpu as iced 0.14 (unifies to one instance) for the custom video shader.
wgpu = "27"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# `swf 0.2.2` is pulled from two sources — crates.io (by Ruffle's build-time
# `rascal` compiler) and Ruffle's git workspace — and that duplicate can't be
# vendored offline for nix (the two collide; and a git [patch] can't be resolved
# from an offline vendor — cargo bypasses source-replacement for patches). So
# point BOTH sources at one vendored copy of swf (path deps need no git). The
# copy under vendor/swf is Ruffle's swf 0.2.2 with workspace inheritance inlined.
[patch.crates-io]
swf = { path = "vendor/swf" }

[patch."https://github.com/ruffle-rs/ruffle"]
swf = { path = "vendor/swf" }

# Release tuning, aimed mainly at the static Windows .exe but a win everywhere.
# Deliberately keeps opt-level = 3: ribb's image-grid decode (the `image` crate)
# is CPU-bound and noticeably slower at "s"/"z", so we trade size only via levers
# that don't hurt throughput — fat LTO (cross-crate inlining + dead-code removal),
# a single codegen unit (more inlining/DCE, smaller output), and panic = "abort"
# (drops the unwind tables and landing pads — we never catch_unwind). `strip`
# removes the symbol table rustc would otherwise leave in the binary.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
