[package]
name = "ribb"
version = "0.1.0"
edition = "2021"
description = "rust iced booru browser — a native port of ebb"
license = "MIT OR Apache-2.0"

[lib]
name = "ribb"
path = "src/lib.rs"

[[bin]]
name = "ribb"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls avoids OpenSSL system linkage on Nix; json for response decoding.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
thiserror = "2"
# Normalize provider timestamps to RFC3339 UTC (matches ebb's Date.toISOString()).
chrono = { version = "0.4", default-features = false, features = [
    "std",
    "clock",
] }
# Gelbooru/Rule34 return double-HTML-encoded tag names.
html-escape = "0.2"

# GUI. `wgpu` + `advanced` match iced_ruffle (shared wgpu device); `image` for
# thumbnails/full images; `tokio` drives async Tasks (reqwest fetches).
iced = { version = "0.14", features = ["tokio", "image", "wgpu", "advanced"] }
# SWF playback widget (pins iced 0.14 / wgpu 27).
iced_ruffle = { git = "https://github.com/pikdum/iced_ruffle" }
# iced_ruffle = { path = "../iced_ruffle" }
# Persist settings under the platform config dir (replaces ebb's localStorage).
directories = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Open post pages / links in the user's browser.
open = "5"
# Retry-delay sleeps + a semaphore to cap concurrent image fetch/decode.
tokio = { version = "1", features = ["time", "sync", "rt"] }
# Decode + downscale thumbnails off the render thread (same version as iced).
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "gif",
    "webp",
] }
lucide-icons = { version = "1.17.0", features = ["iced"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
