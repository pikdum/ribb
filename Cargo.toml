[package]
name = "ribb"
version = "0.1.0"
edition = "2021"
description = "rust iced booru browser — a native port of ebb"
license = "MIT OR Apache-2.0"

[lib]
name = "ribb"
path = "src/lib.rs"

[[bin]]
name = "ribb"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls avoids OpenSSL system linkage on Nix; json for response decoding.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
thiserror = "2"
# Normalize provider timestamps to RFC3339 UTC (matches ebb's Date.toISOString()).
chrono = { version = "0.4", default-features = false, features = [
    "std",
    "clock",
] }
# Gelbooru/Rule34 return double-HTML-encoded tag names.
html-escape = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
