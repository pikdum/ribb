[package]
name = "swf"
version = "0.2.2"
description = "Read and write the Adobe Flash SWF file format."
authors = [
    "Ruffle LLC <ruffle@ruffle.rs>",
]
edition = "2024"
homepage = "https://ruffle.rs"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ruffle-rs/ruffle"

[lints.rust]
renamed_and_removed_lints = "allow"
unknown_lints = "allow"

[lints.clippy]
trivially_copy_pass_by_ref = "deny"
redundant_clone = "deny"
unused_async = "deny"
used_underscore_items = "deny"
dbg_macro = "warn"
enum_glob_use = "deny"
branches_sharing_code = "warn"
needless_pass_by_ref_mut = "warn"
manual_map = "allow"
manual_range_contains = "allow"
assigning_clones = "allow"

[dependencies]
simple_asn1 = "0.6.4"

[dependencies.bitflags]
version = "2.11.1"

[dependencies.bitstream-io]
version = "4.10.0"

[dependencies.byteorder]
version = "1.5"

[dependencies.encoding_rs]
version = "0.8.35"

[dependencies.num-derive]
version = "0.4.2"

[dependencies.num-traits]
version = "0.2.19"

[dependencies.log]
version = "0.4"

[dependencies.flate2]
version = "1.1.9"
optional = true

[dependencies.lzma-rs]
version = "0.3.0"
optional = true

[dependencies.enum-map]
version = "2.7.3"

[features]
default = [
    "flate2",
    "lzma",
]
lzma = [
    "lzma-rs",
]
